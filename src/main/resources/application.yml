spring:
  application:
    name: conciliation-service
  
  datasource:
    url: jdbc:postgresql://${CONCILIATION_DB_HOST:localhost}:${CONCILIATION_DB_PORT:5432}/${CONCILIATION_DB_NAME:conciliation}
    username: ${CONCILIATION_DB_USER:conciliation_user}
    password: ${CONCILIATION_DB_PASSWORD:conciliation_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: conciliation-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.pragma.conciliation.*
        spring.json.value.default.type: com.pragma.conciliation.application.commands.ReconcileMovementCommand
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      properties:
        enable.idempotence: true
        acks: all
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      type: single

conciliation:
  matching-window-minutes: 15
  sla-alert-minutes: 10
  sources:
    - core-bancario
    - gateway-pagos
    - sistema-liquidacion
  idempotency:
    enabled: true
    retention-days: 90
  reprocessing:
    strategy: KAFKA_REPLAY
    batch-size: 100
    max-attempts: 5
  topics:
    movements: bank-movements
    reconciled: reconciled-movements
    dead-letter: bank-movements-dlq
    retry: bank-movements-retry

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      kafkaProducer:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      database:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      kafkaProducer:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      database:
        maxAttempts: 3
        waitDuration: 500ms
  bulkhead:
    instances:
      kafkaProducer:
        maxConcurrentCalls: 100
        maxWaitDuration: 500ms

logging:
  level:
    root: INFO
    com.pragma.conciliation: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/conciliation.log
    max-size: 100MB
    max-history: 30